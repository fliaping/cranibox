# LinuxServer Webtop + DinD + GPU 加速 + 完整开发环境
#
# 基于 linuxserver/webtop:ubuntu-{desktop}（2025.06+ Selkies）
# 官方文档: https://docs.linuxserver.io/images/docker-webtop/
#
# 使用 LinuxServer 标准持久化方式：挂载 /config
#
# 构建选项:
#   默认 XFCE 桌面:   docker compose build --pull
#   KDE 桌面:         DESKTOP=kde docker compose build --pull
#   国内源:            USE_CHINA_MIRROR=true docker compose build --pull
#   或在 .env 文件中设置: DESKTOP=kde
#                         USE_CHINA_MIRROR=true
#
# 分辨率: Selkies 自适应浏览器窗口大小（推荐）
#   固定分辨率: SELKIES_MANUAL_WIDTH=1440 + SELKIES_MANUAL_HEIGHT=900

services:
  agent-workspace:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
      args:
        # 构建时参数（仅影响镜像构建，运行时无效）
        # DESKTOP: xfce(800M) | lxqt(300M) | kde(1.1G)
        - DESKTOP=${DESKTOP:-xfce}
        - USE_CHINA_MIRROR=${USE_CHINA_MIRROR:-false}

    image: xuping/agent-workspace:ubuntu-${DESKTOP:-xfce}
    container_name: agent-workspace
    hostname: agent-workspace

    # Docker 模式（按需选择一种）:
    #   DinD 模式:      取消注释 privileged + START_DOCKER=true
    #   挂载宿主机模式:  取消注释 volumes 中的 docker.sock
    #   不启用 Docker:   保持默认（START_DOCKER=false）
    #privileged: true

    environment:
      # --- LinuxServer 标准变量 ---
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Phoenix}
      - LC_ALL=zh_CN.UTF-8
      # Webtop 默认无认证。远程暴露时务必取消注释并设置强密码。
      #- CUSTOM_USER=agent
      #- PASSWORD=replace-with-a-long-random-password
      - TITLE=Webtop
      # --- Docker（默认不启用，按需选择模式）---
      - START_DOCKER=false
      #- START_DOCKER=true  # DinD 模式时启用
      # --- Selkies ---
      # 默认使用恒定质量 CRF；CBR 仍可在侧栏中按需选择。
      - SELKIES_ENABLE_RATE_CONTROL=true
      - SELKIES_RATE_CONTROL_MODE=crf,cbr
      # GCC 会启用自适应码率，动态画面容易明显降质。
      - SELKIES_CONGESTION_CONTROL=false
      # 浏览器窗口变化时同步调整虚拟桌面分辨率。
      - SELKIES_ENABLE_RESIZE=true
      # 仅遇到 Wayland 兼容问题时才按需启用 X11 回退：
      #- PIXELFLUX_WAYLAND=false
      # --- GPU 渲染/编码设备路径（按需启用）---
      # Intel/AMD: 取消注释两个节点变量 + devices 部分
      # NVIDIA: 还需取消注释 deploy 部分 + NVIDIA_* 变量
      #- DRINODE=/dev/dri/renderD128
      #- DRI_NODE=/dev/dri/renderD128
      #- NVIDIA_VISIBLE_DEVICES=all
      #- NVIDIA_DRIVER_CAPABILITIES=all
      # --- 自定义（仅 init 服务使用）---
      - USE_CHINA_MIRROR=false
      # --- SSH（设置密码即启用）---
      #- SSH_PASSWORD=password
      # --- Node.js ---
      - NODE_OPTIONS=--max-old-space-size=2048

    volumes:
      # LinuxServer 标准持久化目录
      - ./webtop-data:/config
      # 挂载宿主机 Docker 模式时取消注释
      #- /var/run/docker.sock:/var/run/docker.sock

    ports:
      - "3001:3001"   # HTTPS
      - "3002:3002"   # Isolated HTTPS origin for virtual-space applications
      #- "2222:22"     # SSH
      # 在设备网络中启用 EasyTier 入站监听时，按所选端口取消注释。
      # 仅主动连接其他 EasyTier 成员时无需发布；见 docs/device-networks.md。
      #- "11010:11010/tcp"
      #- "11010:11010/udp"

    # GPU 设备直通（按需启用）
    # Intel/AMD GPU: 取消注释 devices
    # NVIDIA GPU: 取消注释 devices + deploy
    #devices:
    #  - /dev/dri:/dev/dri
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: all
    #          capabilities: [gpu]

    shm_size: "2gb"

    restart: unless-stopped
