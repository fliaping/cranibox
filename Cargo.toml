[workspace]
members = ["crates/cranibox-contracts", "crates/cranibox-net", "crates/cranibox-llm", "crates/cranibox-agents", "crates/workspace-runtime", "crates/workspacectl", "crates/workspace-services", "crates/workspace-web", "crates/cranibox", "crates/workspace-node", "crates/workspace-pty", "apps/node-desktop/src-tauri"]
resolver = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep signature and Noise primitives fast in debug and test builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
