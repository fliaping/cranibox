services:
  agent-workspace:
    image: ${AGENT_WORKSPACE_IMAGE:-xuping/agent-workspace:ubuntu-xfce}
    container_name: agent-workspace
    hostname: agent-workspace
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
      LC_ALL: zh_CN.UTF-8
      CUSTOM_USER: ${AGENT_WORKSPACE_USER:-agent}
      PASSWORD: ${AGENT_WORKSPACE_PASSWORD:?run scripts/remote-up.sh to create .env.remote}
      AGENT_WORKSPACE_BOOTSTRAP: remote
      AGENT_WORKSPACE_AGENT: ${AGENT_WORKSPACE_AGENT:-deepseek-harness}
      CODE_SERVER_BIND: 0.0.0.0:8443
      CODE_SERVER_AUTH: password
      CODE_SERVER_CERT: "true"
      CODE_SERVER_RECONFIGURE: "true"
      START_DOCKER: "false"
      SELKIES_ENABLE_RATE_CONTROL: "true"
      SELKIES_RATE_CONTROL_MODE: crf,cbr
      SELKIES_CONGESTION_CONTROL: "false"
      SELKIES_ENABLE_RESIZE: "true"
      NODE_OPTIONS: --max-old-space-size=2048
      # Optional unattended Tailscale login (see .env.remote.example). The key is
      # moved out of the container environment at boot and never logged.
      TAILSCALE_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TAILSCALE_AUTHKEY_FILE: ${TAILSCALE_AUTHKEY_FILE:-}
      TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME:-agent-workspace}
      TAILSCALE_ADVERTISE_TAGS: ${TAILSCALE_ADVERTISE_TAGS:-}
      TAILSCALE_EXTRA_ARGS: ${TAILSCALE_EXTRA_ARGS:-}
      TAILSCALE_SERVE: ${TAILSCALE_SERVE:-false}
    volumes:
      - ${AGENT_WORKSPACE_DATA:-./webtop-data}:/config
    ports:
      - ${DESKTOP_PORT:-3001}:3001
      - ${CODE_SERVER_PORT:-8443}:8443
    shm_size: 2gb
    restart: unless-stopped
