<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FBF8A"/>
      <stop offset="0.55" stop-color="#11806A"/>
      <stop offset="1" stop-color="#0B4F4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6FFF5"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D3F7EA"/>
      <stop offset="1" stop-color="#A9E9D3"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FDCC2"/>
      <stop offset="1" stop-color="#5CC4A3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#04302B" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824 px squircle centred on a 1024 canvas -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  </g>
  <!-- The box: an isometric cube -->
  <g filter="url(#shadow)">
    <path d="M512 300 L742 420 L512 540 L282 420 Z" fill="url(#top)"/>
    <path d="M282 420 L512 540 L512 790 L282 670 Z" fill="url(#left)"/>
    <path d="M742 420 L512 540 L512 790 L742 670 Z" fill="url(#right)"/>
  </g>
  <!-- Connected devices on the lid -->
  <g stroke="#0E6B57" stroke-width="22" stroke-linecap="round">
    <line x1="512" y1="362" x2="420" y2="430"/>
    <line x1="512" y1="362" x2="604" y2="430"/>
    <line x1="420" y1="430" x2="604" y2="430"/>
  </g>
  <g fill="#0E6B57">
    <circle cx="512" cy="362" r="34"/>
    <circle cx="420" cy="430" r="34"/>
    <circle cx="604" cy="430" r="34"/>
  </g>
  <g fill="#2FBF8A">
    <circle cx="512" cy="362" r="15"/>
    <circle cx="420" cy="430" r="15"/>
    <circle cx="604" cy="430" r="15"/>
  </g>
  <!-- Front edge highlight -->
  <path d="M512 540 L512 790" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6"/>
</svg>
