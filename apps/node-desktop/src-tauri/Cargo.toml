[package]
name = "cranibox-node-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[[bin]]
name = "cranibox-node-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
custom-protocol = ["tauri?/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-notification"]

[dependencies]
cranibox-node = { path = "../../../crates/workspace-node" }
agent-workspace-runtime = { path = "../../../crates/workspace-runtime", default-features = false }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "process"] }
url = "2"
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
