<body>

      <path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/>

  </div>
  <h1>Cranibox</h1>
  <p class="tagline">设备互联的 Agent 工作台 · The agent workspace across your devices</p>
  <p id="status" class="status">正在启动本机节点… · Starting this device…</p>
  <div id="failure" class="failure" hidden>
    <p role="alert" id="error"></p>
    <div class="actions">
      <button id="retry" type="button">重试 · Retry</button>
      <button id="quit" type="button" class="secondary">退出 · Quit</button>
    </div>
  </div>
</main>
<script type="module" src="/src/splash.ts"></script>

</html>
