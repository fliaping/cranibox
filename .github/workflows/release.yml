name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3

    - name: Test image release gate
      run: python3 -m unittest discover -s tests -p test_workspace_image_check.py -v
    
    - name: Test install.sh syntax
      run: |
        bash -n install.sh
        echo "✓ install.sh syntax OK"

    - name: Test Dockerfile syntax
      run: docker buildx build --check --progress=plain -f Dockerfile .

    - name: Validate docker-compose.yml
      run: docker compose config --quiet
    
    - name: ShellCheck
      uses: ludeeus/action-shellcheck@master
      with:
        scandir: '.'
        severity: warning
      continue-on-error: true
