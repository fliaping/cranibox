name: Distribute Cranibox

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      npm:
        type: boolean
        default: true
      dry_run:
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub release tag (must include the distribution tooling)'
        type: string
        required: true
      npm:
        description: 'Publish npm CLI packages'
        type: boolean
        default: true
      dry_run:
        description: 'Validate and pack only; do not publish'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cranibox-distribute-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate immutable tag and matching package versions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -c 'import os, sys; sys.path.insert(0, "scripts/release"); from release_common import check_versions; check_versions(os.environ["RELEASE_TAG"])'
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Download existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease > release-metadata.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path("release-metadata.json").read_text())
          tag = os.environ["RELEASE_TAG"]
          assert metadata["tagName"] == tag and not metadata["isDraft"], "Expected a published GitHub release"
          assert metadata["isPrerelease"] == ("-" in tag), "Use a prerelease tag (e.g. v1.2.0-beta.1) for prereleases"
          PY
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
      - name: Verify checksums and prepare npm packages
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          NPM_PACKAGE_NAME: ${{ vars.CRANIBOX_NPM_PACKAGE || '@fliaping/cranibox' }}
        run: |
          python scripts/release/build-npm.py --tag "$RELEASE_TAG" --assets release-assets --output dist/npm --package-name "$NPM_PACKAGE_NAME"
          python scripts/release/publish-npm.py --directory dist/npm --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: cranibox-distribution-${{ inputs.tag }}
          path: |
            release-assets/
            release-metadata.json
            dist/npm/
          if-no-files-found: error
          retention-days: 14

  npm:
    if: inputs.npm
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: cranibox-distribution-${{ inputs.tag }}
          path: prepared
      - name: Publish platform packages before the CLI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python scripts/release/publish-npm.py --directory prepared/dist/npm "${args[@]}"
