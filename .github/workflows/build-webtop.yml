name: Build Multi-Arch Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: true
        default: 'latest'
      desktop:
        description: 'Desktop to verify (all builds every variant)'
        type: choice
        options: [all, xfce, lxqt, kde]
        default: all
      publish:
        description: 'Publish verified images and update public desktop tags'
        type: boolean
        default: false

# A second release must not race an older run when updating floating tags.
concurrency:
  group: workspace-image-release
  cancel-in-progress: false

env:
  REGISTRY_DOCKERHUB: xuping
  REGISTRY_ALIYUN: registry.cn-hangzhou.aliyuncs.com/fliaping
  IMAGE_NAME: agent-workspace

jobs:
  # ==========================================
  # Verify a local image or a registry candidate before promotion.
  # ==========================================
  build-dockerhub:
    runs-on: ubuntu-latest
    environment: docker-hub
    permissions:
      contents: read
      packages: write
    strategy:
      # Build every desktop variant even if another one fails.
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.desktop != 'all' && format('["{0}"]', inputs.desktop) || '["lxqt","xfce","kde"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make room for the complete development image
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to Docker Hub
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          [[ "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,110}$ ]] || { echo 'Invalid image version'; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cranibox-check-${{ matrix.desktop }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # Resolve the latest official Webtop tag even when build cache exists.
          pull: true
          # Check-only runs need neither registry credentials nor published tags.
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          load: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: DESKTOP=${{ matrix.desktop }}
          cache-from: type=gha,scope=${{ matrix.desktop }}
          cache-to: type=gha,mode=max,scope=${{ matrix.desktop }}
          platforms: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

      - name: Verify fresh startup, space enrollment and restart
        env:
          PUBLISH_IMAGE: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          LOCAL_IMAGE: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="$LOCAL_IMAGE"
          if [ "$PUBLISH_IMAGE" = true ]; then
            image="$REGISTRY_DOCKERHUB/$IMAGE_NAME@$IMAGE_DIGEST"
            docker pull --platform linux/amd64 "$image"
          fi
          python3 scripts/verify-workspace-image.py --image "$image" --revision "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/image-startup-${{ matrix.desktop }}.json"

      - name: Upload sanitized startup acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-startup-${{ matrix.desktop }}
          path: ${{ runner.temp }}/image-startup-${{ matrix.desktop }}.json
          if-no-files-found: warn

      - name: Promote the verified image to public tags
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          DESKTOP: ${{ matrix.desktop }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          repository="$REGISTRY_DOCKERHUB/$IMAGE_NAME"
          tags=(--tag "$repository:ubuntu-$DESKTOP")
          if [ "$VERSION" != latest ]; then
            tags+=(--tag "$repository:ubuntu-$DESKTOP-$VERSION")
          fi
          docker buildx imagetools create "${tags[@]}" "$repository@$IMAGE_DIGEST"

  # ==========================================
  # The mirror candidate also needs acceptance before its public tags move.
  # ==========================================
  push-aliyun:
    runs-on: ubuntu-latest
    needs: build-dockerhub
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    environment: aliyun
    permissions:
      contents: read
    strategy:
      # Build every desktop variant even if another one fails.
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.desktop != 'all' && format('["{0}"]', inputs.desktop) || '["lxqt","xfce","kde"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make room for the complete development image
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          [[ "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,110}$ ]] || { echo 'Invalid image version'; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_ALIYUN }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cranibox-check-${{ matrix.desktop }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build mirror candidate from cache
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          # This registry rejects BuildKit provenance attestation manifests.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: DESKTOP=${{ matrix.desktop }}
          cache-from: type=gha,scope=${{ matrix.desktop }}
          platforms: linux/amd64,linux/arm64

      - name: Verify mirror startup, space enrollment and restart
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="$REGISTRY_ALIYUN/$IMAGE_NAME@$IMAGE_DIGEST"
          docker pull --platform linux/amd64 "$image"
          python3 scripts/verify-workspace-image.py --image "$image" --revision "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/image-startup-aliyun-${{ matrix.desktop }}.json"

      - name: Upload sanitized mirror acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-startup-aliyun-${{ matrix.desktop }}
          path: ${{ runner.temp }}/image-startup-aliyun-${{ matrix.desktop }}.json
          if-no-files-found: warn

      - name: Promote the verified mirror to public tags
        env:
          DESKTOP: ${{ matrix.desktop }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          repository="$REGISTRY_ALIYUN/$IMAGE_NAME"
          tags=(--tag "$repository:ubuntu-$DESKTOP")
          if [ "$VERSION" != latest ]; then
            tags+=(--tag "$repository:ubuntu-$DESKTOP-$VERSION")
          fi
          docker buildx imagetools create "${tags[@]}" "$repository@$IMAGE_DIGEST"
