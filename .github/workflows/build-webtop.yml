name: Build Multi-Arch Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: true
        default: 'latest'
      desktop:
        description: 'Desktop to verify (all builds every variant)'
        type: choice
        options: [all, xfce, lxqt, kde]
        default: all
      architecture:
        description: 'Architecture to verify on a native runner (publish always checks both)'
        type: choice
        options: [all, amd64, arm64]
        default: all
      publish:
        description: 'Publish verified images and update public desktop tags'
        type: boolean
        default: false

# A second release must not race an older run when updating floating tags.
concurrency:
  group: workspace-image-release
  cancel-in-progress: false

env:
  REGISTRY_DOCKERHUB: xuping
  REGISTRY_ALIYUN: registry.cn-hangzhou.aliyuncs.com/fliaping
  REGISTRY_GHCR: ghcr.io/fliaping
  IMAGE_NAME: agent-workspace

jobs:
  # ==========================================
  # Verify a local image or a registry candidate before promotion.
  # ==========================================
  build-dockerhub:
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    environment: docker-hub
    permissions:
      contents: read
      packages: write
    strategy:
      # Build every desktop variant even if another one fails.
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.desktop != 'all' && format('["{0}"]', inputs.desktop) || '["lxqt","xfce","kde"]') }}
        # Publishing builds one multi-arch candidate, then checks both platform manifests.
        # Check-only jobs use native runners and never need registry credentials.
        architecture: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.publish) && '["amd64"]' || (inputs.architecture == 'amd64' && '["amd64"]' || inputs.architecture == 'arm64' && '["arm64"]' || '["amd64","arm64"]')) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Make room for the complete development image
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to Docker Hub
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          [[ "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,110}$ ]] || { echo 'Invalid image version'; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cranibox-check-${{ matrix.desktop }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # Resolve the latest official Webtop tag even when build cache exists.
          pull: true
          # Check-only runs need neither registry credentials nor published tags.
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          # One plain two-platform index: mirrors copy it unchanged and the Alibaba Cloud
          # registry rejects attestation manifests.
          provenance: false
          load: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: DESKTOP=${{ matrix.desktop }}
          cache-from: |
            type=gha,scope=${{ matrix.desktop }}-${{ matrix.architecture }}
            type=gha,scope=${{ matrix.desktop }}
          cache-to: type=gha,mode=max,scope=${{ matrix.desktop }}-${{ matrix.architecture }}
          platforms: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && 'linux/amd64,linux/arm64' || format('linux/{0}', matrix.architecture) }}

      - name: Verify fresh startup, space enrollment and restart
        env:
          PUBLISH_IMAGE: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          LOCAL_IMAGE: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          ARCHITECTURE: ${{ matrix.architecture }}
          DESKTOP: ${{ matrix.desktop }}
        run: |
          image="$LOCAL_IMAGE"
          architectures=("$ARCHITECTURE")
          pull_args=()
          if [ "$PUBLISH_IMAGE" = true ]; then
            # The arm64 manifest is verified on a native arm64 runner (verify-dockerhub-arm64):
            # under QEMU its first boot does not finish in time.
            image="$REGISTRY_DOCKERHUB/$IMAGE_NAME@$IMAGE_DIGEST"
            pull_args=(--pull)
          fi
          for architecture in "${architectures[@]}"; do
            timeout=600
            python3 scripts/verify-workspace-image.py --image "$image" --revision "$GITHUB_SHA" \
              --platform "linux/$architecture" "${pull_args[@]}" --timeout "$timeout" \
              --report "$RUNNER_TEMP/image-startup-$DESKTOP-$architecture.json"
          done

      - name: Upload sanitized startup acceptance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-startup-${{ matrix.desktop }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/image-startup-${{ matrix.desktop }}-*.json
          retention-days: 30
          if-no-files-found: warn

  # ==========================================
  # Both platform manifests pass on native runners before any public tag moves.
  # ==========================================
  verify-dockerhub-arm64:
    runs-on: ubuntu-24.04-arm
    needs: build-dockerhub
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    environment: docker-hub
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.desktop != 'all' && format('["{0}"]', inputs.desktop) || '["lxqt","xfce","kde"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Make room for the complete development image
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify the arm64 manifest natively
        env:
          DESKTOP: ${{ matrix.desktop }}
        run: |
          python3 scripts/verify-workspace-image.py \
            --image "$REGISTRY_DOCKERHUB/$IMAGE_NAME:cranibox-check-$DESKTOP-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --revision "$GITHUB_SHA" --platform linux/arm64 --pull --timeout 900 \
            --report "$RUNNER_TEMP/image-startup-$DESKTOP-arm64-native.json"
      - name: Upload sanitized startup acceptance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-startup-${{ matrix.desktop }}-arm64-native
          path: ${{ runner.temp }}/image-startup-${{ matrix.desktop }}-arm64-native.json
          retention-days: 30
          if-no-files-found: warn

  promote-dockerhub:
    runs-on: ubuntu-latest
    needs: [build-dockerhub, verify-dockerhub-arm64]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    environment: docker-hub
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.desktop != 'all' && format('["{0}"]', inputs.desktop) || '["lxqt","xfce","kde"]') }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote the verified image to public tags
        env:
          DESKTOP: ${{ matrix.desktop }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then VERSION="$REQUESTED_VERSION"; else VERSION=${GITHUB_REF#refs/tags/v}; fi
          [[ "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,110}$ ]] || { echo 'Invalid image version'; exit 1; }
          repository="$REGISTRY_DOCKERHUB/$IMAGE_NAME"
          tags=(--tag "$repository:ubuntu-$DESKTOP")
          if [ "$VERSION" != latest ]; then
            tags+=(--tag "$repository:ubuntu-$DESKTOP-$VERSION")
          fi
          docker buildx imagetools create "${tags[@]}" "$repository:cranibox-check-$DESKTOP-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  # ==========================================
  # Mirrors receive the verified Docker Hub index byte for byte: same digest, both
  # architectures, nothing rebuilt. Spaces may pull from any of the three.
  # ==========================================
  sync-mirrors:
    runs-on: ubuntu-latest
    needs: promote-dockerhub
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    environment: ${{ matrix.mirror == 'aliyun' && 'aliyun' || 'docker-hub' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.desktop != 'all' && format('["{0}"]', inputs.desktop) || '["lxqt","xfce","kde"]') }}
        mirror: [ghcr, aliyun]
    steps:
      - name: Copy the verified index to the mirror
        env:
          DESKTOP: ${{ matrix.desktop }}
          MIRROR: ${{ matrix.mirror }}
          REQUESTED_VERSION: ${{ inputs.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then VERSION="$REQUESTED_VERSION"; else VERSION=${GITHUB_REF#refs/tags/v}; fi
          [[ "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,110}$ ]] || { echo 'Invalid image version'; exit 1; }
          # The source is public; signing in only raises Docker Hub's pull limit.
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            printf '%s' "$DOCKERHUB_TOKEN" | skopeo login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
          fi
          if [ "$MIRROR" = ghcr ]; then
            target="$REGISTRY_GHCR/$IMAGE_NAME"
            printf '%s' "$GHCR_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          else
            target="$REGISTRY_ALIYUN/$IMAGE_NAME"
            printf '%s' "$ALIYUN_PASSWORD" | skopeo login --username "$ALIYUN_USERNAME" --password-stdin registry.cn-hangzhou.aliyuncs.com
          fi
          source="docker://docker.io/$REGISTRY_DOCKERHUB/$IMAGE_NAME:cranibox-check-$DESKTOP-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          expected=$(skopeo inspect --raw "$source" | sha256sum | cut -d' ' -f1)
          tags=("ubuntu-$DESKTOP")
          if [ "$VERSION" != latest ]; then tags+=("ubuntu-$DESKTOP-$VERSION"); fi
          for tag in "${tags[@]}"; do
            skopeo copy --all --preserve-digests --retry-times 3 "$source" "docker://$target:$tag"
            actual=$(skopeo inspect --raw "docker://$target:$tag" | sha256sum | cut -d' ' -f1)
            [ "$actual" = "$expected" ] || { echo "$target:$tag digest sha256:$actual differs from Docker Hub sha256:$expected"; exit 1; }
            echo "$target:$tag = sha256:$expected"
          done
