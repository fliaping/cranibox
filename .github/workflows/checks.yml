name: Repository checks

# Shell scripts and installer stubs; Rust and the apps are covered by
# rust-runtime.yml. The workspace image lives in fliaping/agent-workspace.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test installer stub syntax
        run: bash -n install.sh && bash -n scripts/agent-workspace-manager

      # Errors fail the check; warnings are listed without failing it.
      - name: ShellCheck
        run: |
          command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --version
          git ls-files -z '*.sh' install.sh scripts/agent-workspace-manager | xargs -0 shellcheck -S error
          git ls-files -z '*.sh' | xargs -0 shellcheck -S warning -f gcc || true
