name: Android phone node

on:
  push:
    branches: ['**']
    paths: ['apps/node-android/**', 'Cargo.*', 'crates/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/node-android/**', 'Cargo.*', 'crates/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # v4 no longer installs the removed `tools` package (v3's default).
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Test bridge and node protocol
        run: cargo test --locked -p agent-workspace-runtime --lib peers::computer::tests
      - name: Build ARM64 node
        working-directory: apps/node-android
        env:
          PICOCLAW_SRC: ${{ runner.temp }}/picoclaw
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" ./build-native.sh
      - name: Test and build APK
        working-directory: apps/node-android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: cranibox-android-arm64-debug
          path: apps/node-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            apps/node-android/core/build/reports/tests/
            apps/node-android/app/build/reports/tests/
            apps/node-android/app/build/reports/lint-results-debug.*
