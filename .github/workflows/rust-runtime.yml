name: Cranibox server and desktop app

on:
  push:
    branches: ['**']
    # Tag pushes skip path filters; a v* tag publishes the release below.
    tags: ['v*']
    paths: ['npm/**', 'scripts/release/**', 'tests/test_distribution.py', 'tests/test_runtime_update.py', '.github/workflows/distribute.yml', 'apps/node-desktop/**', 'Cargo.*', 'crates/**', 'tests/test_cranibox_terminal.py', 'tests/test_node_peers.py', 'tests/test_computer_use.py', 'tests/test_browser_use.py', 'tests/test_browser_real_chromium.py', 'tests/test_remote_desktops.py', 'tests/test_desktop_service.py', 'tests/test_desktop_real_vnc.py', 'tests/test_desktop_real_wayland.py', 'tests/test_device_networks.py', 'tests/test_device_messages.py', 'tests/test_device_tasks.py', 'tests/test_federated_activity.py', 'tests/test_task_runs.py', 'tests/test_task_worker_mcp.py', 'tests/test_automatic_task_worker.py', 'tests/test_collaboration_runs.py', 'tests/test_task_dependencies.py', 'tests/test_project_catalog_sync.py', 'tests/test_background_project_sync.py', 'tests/test_background_agent_sync.py', 'tests/test_background_activity_sync.py', 'tests/test_agent_executions.py', 'tests/test_remote_agent_executions.py', 'tests/test_project_handoffs.py', 'tests/test_project_streaming.py', 'tests/test_agent_runs_mcp.py', 'tests/desktop_vnc_fixture.py', 'tests/test_virtual_spaces.py', 'tests/test_space_catalog.py', 'tests/space_docker_fixture.py', 'docs/licenses/**', 'tests/test_web_direct_peers.py', 'tests/test_web_peer_paths.py', 'tests/test_web_host_node.py', 'tests/test_workspacectl_rust.py', 'tests/test_workspace_services.py', 'tests/test_workspace_bootstrap.py', 'tests/test_workspace_web_operations.py', 'tests/workspace_web_harness.py', 'scripts/measure-workspace-resources.py', 'scripts/workspacectl-web.py', 'scripts/check-control-center-web.mjs', 'scripts/build-control-center-ui.cjs', 'addons/control-center/**', 'addons/novnc/**', 'extensions/control-center/control-center.js', 'scripts/install-workspace-services.sh', 'scripts/install-workspace-web.sh', 's6-rc.d/**', 'services/**', 'Dockerfile', 'scripts/workspacectl', 'scripts/install-workspacectl.sh', 'scripts/install-cranibox.sh', 'scripts/install-cranibox.py', 'scripts/install-herdr.py', 'scripts/bootstrap-workspace-core.sh', '.github/workflows/rust-runtime.yml']
  pull_request:
    paths: ['npm/**', 'scripts/release/**', 'tests/test_distribution.py', 'tests/test_runtime_update.py', '.github/workflows/distribute.yml', 'apps/node-desktop/**', 'Cargo.*', 'crates/**', 'tests/test_cranibox_terminal.py', 'tests/test_node_peers.py', 'tests/test_computer_use.py', 'tests/test_browser_use.py', 'tests/test_browser_real_chromium.py', 'tests/test_remote_desktops.py', 'tests/test_desktop_service.py', 'tests/test_desktop_real_vnc.py', 'tests/test_desktop_real_wayland.py', 'tests/test_device_networks.py', 'tests/test_device_messages.py', 'tests/test_device_tasks.py', 'tests/test_federated_activity.py', 'tests/test_task_runs.py', 'tests/test_task_worker_mcp.py', 'tests/test_automatic_task_worker.py', 'tests/test_collaboration_runs.py', 'tests/test_task_dependencies.py', 'tests/test_project_catalog_sync.py', 'tests/test_background_project_sync.py', 'tests/test_background_agent_sync.py', 'tests/test_background_activity_sync.py', 'tests/test_agent_executions.py', 'tests/test_remote_agent_executions.py', 'tests/test_project_handoffs.py', 'tests/test_project_streaming.py', 'tests/test_agent_runs_mcp.py', 'tests/desktop_vnc_fixture.py', 'tests/test_virtual_spaces.py', 'tests/test_space_catalog.py', 'tests/space_docker_fixture.py', 'docs/licenses/**', 'tests/test_web_direct_peers.py', 'tests/test_web_peer_paths.py', 'tests/test_web_host_node.py', 'tests/test_workspacectl_rust.py', 'tests/test_workspace_services.py', 'tests/test_workspace_bootstrap.py', 'tests/test_workspace_web_operations.py', 'tests/workspace_web_harness.py', 'scripts/measure-workspace-resources.py', 'scripts/workspacectl-web.py', 'scripts/check-control-center-web.mjs', 'scripts/build-control-center-ui.cjs', 'addons/control-center/**', 'addons/novnc/**', 'extensions/control-center/control-center.js', 'scripts/install-workspace-services.sh', 'scripts/install-workspace-web.sh', 's6-rc.d/**', 'services/**', 'Dockerfile', 'scripts/workspacectl', 'scripts/install-workspacectl.sh', 'scripts/install-cranibox.sh', 'scripts/install-cranibox.py', 'scripts/install-herdr.py', 'scripts/bootstrap-workspace-core.sh', '.github/workflows/rust-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution-tests:
    name: Distribution tooling and npm launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -p test_distribution.py -v
  wayland:
    name: Real Wayland desktop (Sway and wayvnc)
    runs-on: ubuntu-latest
    # wayvnc in older runner repositories predates the managed provider's 0.8 minimum.
    container: ubuntu:26.04
    steps:
      - name: Install isolated desktop test dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config python3 sway swaybg wayvnc fonts-dejavu-core
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wayland
      - run: npm ci --prefix addons/control-center/ui
      - run: cargo build --locked --workspace
      - name: Verify real Wayland authentication, pixels, keyboard and independent node recovery
        shell: bash
        run: |
          useradd --create-home cranibox-test
          runuser -u cranibox-test -- env "PATH=$PATH" CRANIBOX_TEST_REAL_WAYLAND=1 python3 -m unittest discover -s tests -p test_desktop_real_wayland.py -v
  desktop:
    name: node desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: node-desktop
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev librsvg2-dev libayatana-appindicator3-dev pkg-config libglib2.0-bin python3
        if: runner.os == 'Linux'
      - run: npm ci --prefix apps/node-desktop
      - run: npm run build --prefix apps/node-desktop
      - run: cargo clippy --locked -p cranibox-node-desktop --features desktop --all-targets -- -D warnings
      - name: Verify Linux login launcher with spaces and reserved path characters
        if: runner.os == 'Linux'
        run: cargo test --locked -p cranibox-node-desktop --lib gio_launches -- --ignored --nocapture
      - run: npx playwright install --with-deps chromium
        working-directory: apps/node-desktop
        if: runner.os == 'Linux'
      - run: npm test
        working-directory: apps/node-desktop
        if: runner.os == 'Linux'
      # One stable signing identity keeps macOS privacy grants (Screen Recording,
      # Accessibility) across updates; ad-hoc signatures change with every build.
      # Without the secrets (e.g. forks) the app stays ad-hoc signed.
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE" ] || [ -z "$IDENTITY" ]; then
            echo "No signing certificate configured; the app stays ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/cranibox-signing.keychain-db"
          password=$(openssl rand -hex 16)
          printf %s "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate: trusted for code signing on this runner only.
          security find-certificate -c "$IDENTITY" -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          security find-identity -v -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      # npm ships the standalone node on every platform. Build and copy it first:
      # the app bundle renames its own binary to target/release/cranibox[.exe].
      - name: Build the Linux command line
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p cranibox --no-default-features
          mkdir -p "$RUNNER_TEMP/cli"
          cp target/release/cranibox "$RUNNER_TEMP/cli/cranibox-linux-x86_64"
          "$RUNNER_TEMP/cli/cranibox-linux-x86_64" --version
      - name: Build the macOS command line
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --release --locked -p cranibox --no-default-features
          mkdir -p "$RUNNER_TEMP/cli"
          cp target/release/cranibox "$RUNNER_TEMP/cli/cranibox-macos-arm64"
          "$RUNNER_TEMP/cli/cranibox-macos-arm64" --version
      - name: Build the Windows command line
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked -p cranibox --no-default-features
          mkdir -p "$RUNNER_TEMP/cli"
          cp target/release/cranibox.exe "$RUNNER_TEMP/cli/cranibox-windows-x86_64.exe"
          "$RUNNER_TEMP/cli/cranibox-windows-x86_64.exe" --version
      - run: npm run tauri -- build --features desktop --bundles ${{ matrix.bundles }} -- --locked
        working-directory: apps/node-desktop
        env:
          # On CI the bundler otherwise skips the Finder step that lays out the disk
          # image window: its background and the app/Applications icon positions.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
      - name: The app answers as the cranibox command
        shell: bash
        run: |
          set -euo pipefail
          app=target/release/cranibox; [ -f "$app.exe" ] && app="$app.exe"
          test "$("$app" --version)" = "cranibox $(node -p "require('./apps/node-desktop/src-tauri/tauri.conf.json').version")"
          "$app" node --help | grep -q 'Usage: '
      # Gatekeeper assesses a signed disk image and blocks one signed by a
      # certificate Apple does not know; an unsigned image opens directly. Only the
      # app keeps the signature (opened once via Privacy & Security > Open Anyway).
      - name: Leave the macOS disk image unsigned
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg=$(ls target/release/bundle/dmg/*.dmg | head -1)
          if codesign -dv "$dmg" 2>/dev/null; then
            codesign --remove-signature "$dmg" || true
          fi
          if codesign -dv "$dmg" 2>/dev/null; then
            # Fallback: a fresh copy of the image carries no signature.
            hdiutil convert "$dmg" -format UDZO -imagekey zlib-level=9 -o "$dmg.unsigned.dmg" >/dev/null
            mv -f "$dmg.unsigned.dmg" "$dmg"
          fi
          if codesign -dv "$dmg" 2>/dev/null; then
            echo "The disk image is still signed" >&2
            exit 1
          fi
          hdiutil verify "$dmg" >/dev/null
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Check what ships: the app inside the disk image.
          dmg=$(ls target/release/bundle/dmg/*.dmg | head -1)
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" >/dev/null
          trap 'hdiutil detach "$mount" >/dev/null' EXIT
          app="$mount/Cranibox.app"
          # The Finder layout (background and icon positions) ships in the image.
          test -f "$mount/.DS_Store"
          swift apps/node-desktop/scripts/check-dmg-background.swift \
            "$mount/.background/background.generated.tiff" \
            apps/node-desktop/src-tauri/tauri.conf.json
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|Signature'
          codesign -d -r- "$app"
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign -dv --verbose=2 "$app" 2>&1 | grep -q "Authority=$APPLE_SIGNING_IDENTITY"
            codesign -dv "$app" 2>&1 | grep -q '^Identifier=com.cranibox.node$'
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/upload-artifact@v7
        with:
          name: cranibox-desktop-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: cranibox-cli-linux
          path: ${{ runner.temp }}/cli/cranibox-linux-x86_64
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: cranibox-cli-macos
          path: ${{ runner.temp }}/cli/cranibox-macos-arm64
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: cranibox-cli-windows
          path: ${{ runner.temp }}/cli/cranibox-windows-x86_64.exe
          retention-days: 14
          if-no-files-found: error
      # Last, so the binaries above are uploaded for inspection even when it fails.
      # The shipped program on each platform: adopt, update through npm, roll back,
      # and default management for a plain start (with a loopback registry).
      - name: Self-update with the real program
        shell: bash
        timeout-minutes: 15
        run: |
          CRANIBOX_BIN="$(ls "$RUNNER_TEMP"/cli/cranibox-*)" python -m unittest tests.test_runtime_update -v
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/install-herdr.py --output-directory target/herdr
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo check --locked -p cranibox-node
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Contract snapshot (fixtures round-trip through cranibox-contracts types)
        run: cargo test --locked -p cranibox-contracts --test fixtures
      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y s6 xvfb x11vnc x11-utils x11-xserver-utils xdotool
        if: runner.os == 'Linux'
      - run: npm ci --prefix addons/control-center/ui
        if: runner.os == 'Linux'
      - run: node scripts/build-control-center-ui.cjs && git diff --exit-code -- addons/control-center/index.en.html addons/control-center/index.zh-cn.html addons/control-center/web.js addons/control-center/web.css
        if: runner.os == 'Linux'
      - run: npx --prefix addons/control-center/ui playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm test --prefix addons/control-center/ui
        if: runner.os == 'Linux'
        env:
          CRANIBOX_HERDR_BIN: ../../../target/herdr/herdr
      - run: npm run test:terminal --prefix addons/control-center/ui
        if: runner.os == 'Linux'
        env:
          CRANIBOX_HERDR_BIN: ../../../target/herdr/herdr
      - run: npm run test:access --prefix addons/control-center/ui
        if: runner.os == 'Linux'
      - run: npm run test:paths --prefix addons/control-center/ui
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'Linux'
        with:
          name: playwright-results
          path: addons/control-center/ui/test-results*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Browser Use with an isolated real Chromium and official MCP
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export CRANIBOX_TEST_CHROMIUM="$(node -e "console.log(require('./addons/control-center/ui/node_modules/playwright-core').chromium.executablePath())")"
          npx --yes chrome-devtools-mcp@1.11.0 --help > /dev/null
          python -m unittest discover -s tests -p test_browser_real_chromium.py -v
        env:
          CRANIBOX_TEST_REAL_BROWSER: '1'
      - run: python -m unittest discover -s tests -p test_workspace_bootstrap.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_workspace_services.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_workspace_web_operations.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_cranibox_terminal.py -v
        if: runner.os == 'Linux'
        env:
          CRANIBOX_HERDR_BIN: target/herdr/herdr
      - run: python -m unittest discover -s tests -p test_web_direct_peers.py -v
        if: runner.os == 'Linux'
        env:
          CRANIBOX_HERDR_BIN: target/herdr/herdr
      - run: python -m unittest discover -s tests -p test_web_peer_paths.py -v
        if: runner.os == 'Linux'
        env:
          CRANIBOX_HERDR_BIN: target/herdr/herdr
      - run: python -m unittest discover -s tests -p test_project_catalog_sync.py -v
        if: runner.os == 'Linux'
        env:
          CRANIBOX_HERDR_BIN: target/herdr/herdr
      - run: python -m unittest discover -s tests -p test_background_project_sync.py -v
        if: runner.os == 'Linux'
        env:
          CRANIBOX_HERDR_BIN: target/herdr/herdr
      - run: python -m unittest discover -s tests -p test_background_agent_sync.py -v
        if: runner.os == 'Linux'
        env:
          CRANIBOX_HERDR_BIN: target/herdr/herdr
      - run: python -m unittest discover -s tests -p test_background_activity_sync.py -v
        if: runner.os == 'Linux'
        env:
          CRANIBOX_HERDR_BIN: target/herdr/herdr
      - run: python -m unittest discover -s tests -p test_web_host_node.py -v
        if: runner.os == 'Linux'
        env:
          CRANIBOX_HERDR_BIN: target/herdr/herdr
      - run: python -m unittest discover -s tests -p test_device_messages.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_device_tasks.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_federated_activity.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_task_runs.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_task_worker_mcp.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_automatic_task_worker.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_collaboration_runs.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_task_dependencies.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_agent_executions.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_remote_agent_executions.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_project_handoffs.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_project_streaming.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_agent_runs_mcp.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_node_peers.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_computer_use.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_browser_use.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_remote_desktops.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_desktop_service.py -v
        if: runner.os == 'Linux'
      - name: Verify real VNC authentication, pixels, input and headless restart
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -p test_desktop_real_vnc.py -v
        env:
          CRANIBOX_TEST_REAL_VNC: '1'
      - run: python -m unittest discover -s tests -p test_device_networks.py -v
        if: runner.os == 'Linux'
      - name: Verify real userspace EasyTier networking, restart and entry failover
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cranibox-easytier.zip" https://github.com/EasyTier/EasyTier/releases/download/v2.6.4/easytier-linux-x86_64-v2.6.4.zip
          printf '%s  %s\n' 61b659eaedba658fa66fe47d17e1426cdd77e5d02fa15fed447bb4357c09dfd6 "$RUNNER_TEMP/cranibox-easytier.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/cranibox-easytier.zip" -d "$RUNNER_TEMP/cranibox-easytier"
          chmod u+x "$RUNNER_TEMP/cranibox-easytier/easytier-linux-x86_64/easytier-core" "$RUNNER_TEMP/cranibox-easytier/easytier-linux-x86_64/easytier-cli"
          CRANIBOX_TEST_EASYTIER_DIR="$RUNNER_TEMP/cranibox-easytier/easytier-linux-x86_64" cargo test --locked -p cranibox-node network::tests::real_ -- --ignored --nocapture --test-threads=1
      - run: python -m unittest discover -s tests -p test_virtual_spaces.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_space_catalog.py -v
        if: runner.os == 'Linux'
      - run: node scripts/check-control-center-web.mjs
        if: runner.os == 'Linux'
      - run: python -m pip install PyYAML
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_workspacectl_rust.py -v
        if: runner.os == 'Linux'
      # The container build (workspace feature) is measured here; only the Docker image ships it.
      - run: cargo build --release --locked -p cranibox
        if: runner.os == 'Linux'
      - run: python scripts/measure-workspace-resources.py --report target/resource-baseline.json
        if: runner.os == 'Linux'
        env:
          CRANIBOX_BIN: target/release/cranibox
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, native, distribution-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches CLI and desktop versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os, sys; sys.path.insert(0, "scripts/release"); from release_common import check_versions; check_versions(os.environ["RELEASE_TAG"])'
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: cranibox-*
      - name: Collect installers and all three command lines
        run: python scripts/release/collect-assets.py --artifacts dist --output release --installers
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Cranibox $GITHUB_REF_NAME" --generate-notes --verify-tag "${args[@]}"
  distribute:
    name: npm distribution
    if: startsWith(github.ref, 'refs/tags/v') && vars.CRANIBOX_PUBLISH_NPM == 'true'
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/distribute.yml
    with:
      tag: ${{ github.ref_name }}
      npm: ${{ vars.CRANIBOX_PUBLISH_NPM == 'true' }}
    secrets: inherit
  publish-dev:
    name: Publish npm dev channel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CRANIBOX_PUBLISH_NPM == 'true'
    needs: [desktop, native, wayland, distribution-tests]
    runs-on: ubuntu-latest
    environment: npm
    env:
      NPM_PUBLISH_MODE: ${{ vars.CRANIBOX_NPM_PUBLISH_MODE || 'direct' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Prepare npm publishing mode
        run: |
          set -euo pipefail
          case "$NPM_PUBLISH_MODE" in
            stage) npm install -g npm@latest ;;
            direct) ;;
            *) echo "CRANIBOX_NPM_PUBLISH_MODE must be stage or direct" >&2; exit 1 ;;
          esac
          npm --version
      - uses: actions/download-artifact@v8
        with:
          pattern: cranibox-cli-*
          path: dist/artifacts
      - name: Collect standalone runtimes and verify npm packages
        env:
          NPM_PACKAGE_NAME: ${{ vars.CRANIBOX_NPM_PACKAGE || '@fliaping/cranibox' }}
        run: |
          set -euo pipefail
          python scripts/release/collect-assets.py --artifacts dist/artifacts --output dist/assets
          version=$(python -c 'import os, sys, tomllib; from pathlib import Path; sys.path.insert(0, "scripts/release"); from release_common import dev_version; print(dev_version(tomllib.loads(Path("crates/cranibox/Cargo.toml").read_text())["package"]["version"], os.environ["GITHUB_RUN_NUMBER"]))')
          python scripts/release/build-npm.py --version "$version" --assets dist/assets --output dist/npm --package-name "$NPM_PACKAGE_NAME"
          python scripts/release/publish-npm.py --directory dist/npm --dist-tag dev --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: cranibox-distribution-dev-${{ github.run_number }}
          overwrite: true
          path: |
            dist/assets/
            dist/npm/
          if-no-files-found: error
          retention-days: 14
      - name: Publish platform packages before the CLI to dev
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_PUBLISH_MODE == 'stage' && secrets.NPM_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [ "$NPM_PUBLISH_MODE" = direct ]; then unset NODE_AUTH_TOKEN; fi
          python scripts/release/publish-npm.py --directory dist/npm --dist-tag dev --mode "$NPM_PUBLISH_MODE"
          if [ "$NPM_PUBLISH_MODE" = direct ]; then
            echo 'npm dev: direct publication completed (including verified existing versions). No 2FA approval needed; no maintainer action required.' >> "$GITHUB_STEP_SUMMARY"
          fi
