  resources:
    name: Workspace resource measurement
    needs: cli
    runs-on: ubuntu-latest
    env:
      AGENT_WORKSPACE_SRC: ${{ github.workspace }}/agent-workspace-src
      CRANIBOX_BIN: target/release/cranibox
      CRANIBOX_HERDR_BIN: target/herdr/herdr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: fliaping/agent-workspace
          path: agent-workspace-src
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update -o APT::Update::Error-Mode=any && sudo apt-get install -y s6
      - run: python scripts/install-herdr.py --output-directory target/herdr
      # Prepare the debug test binary used by measure-workspace-resources.py's offline run.
      - run: cargo test --locked -p agent-workspace-web --no-run
      - uses: actions/download-artifact@v8
        with:
          name: cranibox-cli-linux
          path: ${{ runner.temp }}/cli
      - name: Stage the workspace CLI for resource measurement
        run: |
          mkdir -p target/release
          install -m 0755 "$RUNNER_TEMP/cli/cranibox-linux-x86_64" target/release/cranibox
      - run: python scripts/measure-workspace-resources.py --report target/resource-baseline.json
      - uses: actions/upload-artifact@v7
        with:
          name: resource-baseline
          path: target/resource-baseline.json
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, cli, native, quality, linux-integration, resources, wayland, distribution-tests, linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches CLI and desktop versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os, sys; sys.path.insert(0, "scripts/release"); from release_common import check_versions; check_versions(os.environ["RELEASE_TAG"])'
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: cranibox-*
      - name: Collect installers and all three command lines
        run: python scripts/release/collect-assets.py --artifacts dist --output release --installers
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Cranibox $GITHUB_REF_NAME" --generate-notes --verify-tag "${args[@]}"
  distribute:
    name: npm distribution
    if: startsWith(github.ref, 'refs/tags/v') && vars.CRANIBOX_PUBLISH_NPM == 'true'
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/distribute.yml
    with:
      tag: ${{ github.ref_name }}
      npm: ${{ vars.CRANIBOX_PUBLISH_NPM == 'true' }}
    secrets: inherit
  publish-dev:
    name: Publish npm dev channel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CRANIBOX_PUBLISH_NPM == 'true'
    needs: [desktop, cli, native, quality, linux-integration, resources, wayland, distribution-tests]
    runs-on: ubuntu-latest
    environment: npm
    env:
      # Dev builds publish through Trusted Publishing (OIDC); releases keep their own mode.
      NPM_PUBLISH_MODE: ${{ vars.CRANIBOX_NPM_DEV_PUBLISH_MODE || 'direct' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Prepare npm publishing mode
        run: |
          set -euo pipefail
          case "$NPM_PUBLISH_MODE" in
            stage|direct) npm install -g npm@latest ;;
            *) echo "CRANIBOX_NPM_DEV_PUBLISH_MODE must be stage or direct" >&2; exit 1 ;;
          esac
          npm --version
      - uses: actions/download-artifact@v8
        with:
          pattern: cranibox-cli-*
          path: dist/artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: cranibox-desktop-*
          path: dist/apps
          merge-multiple: true
      - name: Collect standalone runtimes and verify npm packages
        env:
          NPM_PACKAGE_NAME: ${{ vars.CRANIBOX_NPM_PACKAGE || '@fliaping/cranibox' }}
        run: |
          set -euo pipefail
          python scripts/release/collect-assets.py --artifacts dist/artifacts --output dist/assets
          version=$(python -c 'import os, sys, tomllib; from pathlib import Path; sys.path.insert(0, "scripts/release"); from release_common import dev_version; print(dev_version(tomllib.loads(Path("crates/cranibox/Cargo.toml").read_text())["package"]["version"], os.environ["GITHUB_RUN_NUMBER"]))')
          python scripts/release/build-npm.py --version "$version" --assets dist/assets --apps dist/apps --output dist/npm --package-name "$NPM_PACKAGE_NAME"
          python scripts/release/publish-npm.py --directory dist/npm --dist-tag dev --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: cranibox-distribution-dev-${{ github.run_number }}
          overwrite: true
          path: |
            dist/assets/
            dist/npm/
          if-no-files-found: error
          retention-days: 14
      - name: Publish platform packages before the CLI to dev
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_PUBLISH_MODE == 'stage' && secrets.NPM_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [ "$NPM_PUBLISH_MODE" = direct ]; then unset NODE_AUTH_TOKEN; fi
          python scripts/release/publish-npm.py --directory dist/npm --dist-tag dev --mode "$NPM_PUBLISH_MODE"
          if [ "$NPM_PUBLISH_MODE" = direct ]; then
            echo 'npm dev: direct publication completed (including verified existing versions). No 2FA approval needed; no maintainer action required.' >> "$GITHUB_STEP_SUMMARY"
          fi
