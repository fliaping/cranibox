name: Cranibox server and desktop app

on:
  push:
    branches: ['**']
    # Tag pushes skip path filters; a v* tag publishes the release below.
    tags: ['v*']
    paths: ['npm/**', 'scripts/release/**', 'tests/test_distribution.py', 'tests/test_runtime_update.py', '.github/workflows/distribute.yml', 'apps/node-desktop/**', 'Cargo.*', 'crates/**', 'tests/test_cranibox_terminal.py', 'tests/test_node_peers.py', 'tests/test_computer_use.py', 'tests/test_browser_use.py', 'tests/test_browser_real_chromium.py', 'tests/test_remote_desktops.py', 'tests/test_desktop_service.py', 'tests/test_windows_tightvnc.py', 'tests/test_desktop_real_vnc.py', 'tests/test_desktop_real_wayland.py', 'tests/test_device_networks.py', 'tests/test_device_messages.py', 'tests/test_device_tasks.py', 'tests/test_federated_activity.py', 'tests/test_task_runs.py', 'tests/test_task_worker_mcp.py', 'tests/test_automatic_task_worker.py', 'tests/test_collaboration_runs.py', 'tests/test_task_dependencies.py', 'tests/test_project_catalog_sync.py', 'tests/test_background_project_sync.py', 'tests/test_background_agent_sync.py', 'tests/test_background_activity_sync.py', 'tests/test_agent_executions.py', 'tests/test_remote_agent_executions.py', 'tests/test_project_handoffs.py', 'tests/test_project_streaming.py', 'tests/test_agent_runs_mcp.py', 'tests/desktop_vnc_fixture.py', 'tests/test_virtual_spaces.py', 'tests/test_space_catalog.py', 'tests/space_docker_fixture.py', 'docs/licenses/**', 'tests/test_web_direct_peers.py', 'tests/test_web_peer_paths.py', 'tests/test_web_host_node.py', 'tests/test_workspacectl_rust.py', 'tests/test_workspace_services.py', 'tests/test_workspace_web_operations.py', 'tests/workspace_web_harness.py', 'scripts/measure-workspace-resources.py', 'scripts/check-control-center-web.mjs', 'scripts/build-control-center-ui.cjs', 'addons/control-center/**', 'addons/novnc/**', 'scripts/install-herdr.py', '.github/workflows/rust-runtime.yml', 'tests/agent_workspace_source.py']
  pull_request:
    paths: ['npm/**', 'scripts/release/**', 'tests/test_distribution.py', 'tests/test_runtime_update.py', '.github/workflows/distribute.yml', 'apps/node-desktop/**', 'Cargo.*', 'crates/**', 'tests/test_cranibox_terminal.py', 'tests/test_node_peers.py', 'tests/test_computer_use.py', 'tests/test_browser_use.py', 'tests/test_browser_real_chromium.py', 'tests/test_remote_desktops.py', 'tests/test_desktop_service.py', 'tests/test_windows_tightvnc.py', 'tests/test_desktop_real_vnc.py', 'tests/test_desktop_real_wayland.py', 'tests/test_device_networks.py', 'tests/test_device_messages.py', 'tests/test_device_tasks.py', 'tests/test_federated_activity.py', 'tests/test_task_runs.py', 'tests/test_task_worker_mcp.py', 'tests/test_automatic_task_worker.py', 'tests/test_collaboration_runs.py', 'tests/test_task_dependencies.py', 'tests/test_project_catalog_sync.py', 'tests/test_background_project_sync.py', 'tests/test_background_agent_sync.py', 'tests/test_background_activity_sync.py', 'tests/test_agent_executions.py', 'tests/test_remote_agent_executions.py', 'tests/test_project_handoffs.py', 'tests/test_project_streaming.py', 'tests/test_agent_runs_mcp.py', 'tests/desktop_vnc_fixture.py', 'tests/test_virtual_spaces.py', 'tests/test_space_catalog.py', 'tests/space_docker_fixture.py', 'docs/licenses/**', 'tests/test_web_direct_peers.py', 'tests/test_web_peer_paths.py', 'tests/test_web_host_node.py', 'tests/test_workspacectl_rust.py', 'tests/test_workspace_services.py', 'tests/test_workspace_web_operations.py', 'tests/workspace_web_harness.py', 'scripts/measure-workspace-resources.py', 'scripts/check-control-center-web.mjs', 'scripts/build-control-center-ui.cjs', 'addons/control-center/**', 'addons/novnc/**', 'scripts/install-herdr.py', '.github/workflows/rust-runtime.yml', 'tests/agent_workspace_source.py']
  workflow_dispatch:

permissions:
  contents: read

# Stop superseded branch/PR runs from occupying runners. Publishing runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

# Branch/dev builds use a fast optimized profile. Release tags retain thin LTO and
# one codegen unit. Debug/test builds omit symbols without changing assertions.
env:
  # Keep debug assertions while avoiding large debug symbols and slow PDB/link/cache work.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/v') && 'thin' || 'off' }}
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '16' }}
  CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ startsWith(github.ref, 'refs/tags/v') && '3' || '2' }}

jobs:
  distribution-tests:
    name: Distribution tooling and npm launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -p test_distribution.py -v
  wayland:
    name: Real Wayland desktop (Sway and wayvnc)
    # ubuntu-latest now supplies wayvnc >= 0.8; no separate container is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install isolated desktop test dependencies
        run: sudo apt-get update -o APT::Update::Error-Mode=any && sudo apt-get install -y --no-install-recommends sway swaybg wayvnc fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: addons/control-center/ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: false
      - run: npm ci --prefix addons/control-center/ui
      - run: cargo build --locked --workspace
      - name: Verify real Wayland authentication, pixels, keyboard and independent node recovery
        # Sway must run as the normal runner account, not root.
        run: python3 -m unittest discover -s tests -p test_desktop_real_wayland.py -v
        env:
          CRANIBOX_TEST_REAL_WAYLAND: '1'
  cli:
    name: command line (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cranibox-cli-linux
            output: cranibox-linux-x86_64
            features: managed
          - os: windows-latest
            artifact: cranibox-cli-windows
            output: cranibox-windows-x86_64.exe
            features: none
          - os: macos-latest
            artifact: cranibox-cli-macos
            output: cranibox-macos-arm64
            features: none
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-${{ matrix.os }}
          cache-on-failure: true
      - name: Build standalone CLI
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.features }}" = managed ]; then
            cargo build --release --locked -p cranibox --features managed
          else
            cargo build --release --locked -p cranibox --no-default-features
          fi
          mkdir -p "$RUNNER_TEMP/cli"
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/release/cranibox.exe "$RUNNER_TEMP/cli/${{ matrix.output }}"
          else
            cp target/release/cranibox "$RUNNER_TEMP/cli/${{ matrix.output }}"
          fi
          "$RUNNER_TEMP/cli/${{ matrix.output }}" --version
          if [ "${{ matrix.features }}" = managed ]; then
            "$RUNNER_TEMP/cli/${{ matrix.output }}" ctl --version
            grep -q -- --listen <("$RUNNER_TEMP/cli/${{ matrix.output }}" serve --help)
            grep -q -- --port <("$RUNNER_TEMP/cli/${{ matrix.output }}" serve --config-root "$RUNNER_TEMP" --help)
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/cli/${{ matrix.output }}
          retention-days: 14
          if-no-files-found: error
      - name: Self-update with the real program
        shell: bash
        timeout-minutes: 15
        run: |
          CRANIBOX_BIN="$RUNNER_TEMP/cli/${{ matrix.output }}" python -m unittest tests.test_runtime_update -v
  desktop:
    name: node desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
            cli_artifact: cranibox-cli-linux
          - os: windows-latest
            bundles: nsis
            cli_artifact: cranibox-cli-windows
          - os: macos-latest
            bundles: dmg
            cli_artifact: cranibox-cli-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/node-desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: node-desktop
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev librsvg2-dev libayatana-appindicator3-dev pkg-config libglib2.0-bin python3
        if: runner.os == 'Linux'
      - run: npm ci --prefix apps/node-desktop
      - run: npm run build --prefix apps/node-desktop
      # One stable signing identity keeps macOS privacy grants (Screen Recording,
      # Accessibility) across updates; ad-hoc signatures change with every build.
      # Without the secrets (e.g. forks) the app stays ad-hoc signed.
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE" ] || [ -z "$IDENTITY" ]; then
            echo "No signing certificate configured; the app stays ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/cranibox-signing.keychain-db"
          password=$(openssl rand -hex 16)
          printf %s "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate: trusted for code signing on this runner only.
          security find-certificate -c "$IDENTITY" -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          security find-identity -v -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      # The standalone CLI is built by the parallel `cli` job and downloaded below
      # for the self-update integration test.
      # The app reports the version it is published as: dev builds keep the last release's
      # source version, so stamp the npm version (see publish-dev).
      - name: Stamp the published version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(python -c 'import os, sys, tomllib; from pathlib import Path; sys.path.insert(0, "scripts/release"); from release_common import dev_version; print(dev_version(tomllib.loads(Path("crates/cranibox/Cargo.toml").read_text())["package"]["version"], os.environ["GITHUB_RUN_NUMBER"]))')
          fi
          echo "CRANIBOX_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          # The bundle too (Info.plist, installer and disk image names), not only the program.
          printf '{"version":"%s"}\n' "$version" > "$RUNNER_TEMP/tauri-version.json"
      - run: npm run tauri -- build --features desktop --bundles ${{ matrix.bundles }} --config "${{ runner.temp }}/tauri-version.json" -- --locked
        working-directory: apps/node-desktop
        env:
          # On CI the bundler otherwise skips the Finder step that lays out the disk
          # image window: its background and the app/Applications icon positions.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
      - name: The app answers as the cranibox command
        shell: bash
        run: |
          set -euo pipefail
          app=target/release/cranibox; [ -f "$app.exe" ] && app="$app.exe"
          test "$("$app" --version)" = "cranibox $(node -p "require('./apps/node-desktop/src-tauri/tauri.conf.json').version")"
          "$app" node --help | grep -q 'Usage: '
      # Gatekeeper assesses a signed disk image and blocks one signed by a
      # certificate Apple does not know; an unsigned image opens directly. Only the
      # app keeps the signature (opened once via Privacy & Security > Open Anyway).
      - name: Leave the macOS disk image unsigned
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg=$(ls target/release/bundle/dmg/*.dmg | head -1)
          if codesign -dv "$dmg" 2>/dev/null; then
            codesign --remove-signature "$dmg" || true
          fi
          if codesign -dv "$dmg" 2>/dev/null; then
            # Fallback: a fresh copy of the image carries no signature.
            hdiutil convert "$dmg" -format UDZO -imagekey zlib-level=9 -o "$dmg.unsigned.dmg" >/dev/null
            mv -f "$dmg.unsigned.dmg" "$dmg"
          fi
          if codesign -dv "$dmg" 2>/dev/null; then
            echo "The disk image is still signed" >&2
            exit 1
          fi
          hdiutil verify "$dmg" >/dev/null
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Check what ships: the app inside the disk image.
          dmg=$(ls target/release/bundle/dmg/*.dmg | head -1)
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" >/dev/null
          trap 'hdiutil detach "$mount" >/dev/null' EXIT
          app="$mount/Cranibox.app"
          # The Finder layout (background and icon positions) ships in the image.
          test -f "$mount/.DS_Store"
          swift apps/node-desktop/scripts/check-dmg-background.swift \
            "$mount/.background/background.generated.tiff" \
            apps/node-desktop/src-tauri/tauri.conf.json
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|Signature'
          codesign -d -r- "$app"
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign -dv --verbose=2 "$app" 2>&1 | grep -q "Authority=$APPLE_SIGNING_IDENTITY"
            codesign -dv "$app" 2>&1 | grep -q '^Identifier=com.cranibox.node$'
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # A full update installs the AppImage, the Windows installer, or on macOS the signed
      # bundle from the disk image, shipped next to the installers as <dmg name>.app.tar.gz.
      - name: Pack the macOS app bundle for full updates
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls target/release/bundle/dmg/*.dmg | head -1)
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" >/dev/null
          trap 'hdiutil detach "$mount" >/dev/null' EXIT
          if [ -n "$(find "$mount/Cranibox.app" -type l)" ]; then echo "The app bundle contains links" >&2; exit 1; fi
          mkdir -p target/release/bundle/app
          archive="target/release/bundle/app/$(basename "${dmg%.dmg}").app.tar.gz"
          tar -czf "$archive" -C "$mount" Cranibox.app
          ls -l "$archive"
      - uses: actions/upload-artifact@v7
        with:
          name: cranibox-desktop-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app.tar.gz
          retention-days: 14
          if-no-files-found: error
  # Linux arm64 command line (also what the arm64 Agent Workspace image installs).
  linux-arm64:
    name: Linux arm64 command line
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-arm64
          cache-on-failure: true
      - name: Build the Linux arm64 command line
        run: |
          cargo build --release --locked -p cranibox --features managed
          mkdir -p "$RUNNER_TEMP/cli"
          cp target/release/cranibox "$RUNNER_TEMP/cli/cranibox-linux-arm64"
          "$RUNNER_TEMP/cli/cranibox-linux-arm64" --version
          "$RUNNER_TEMP/cli/cranibox-linux-arm64" ctl --version
          # On a device `serve` is the node; with --config-root it is the container console.
          grep -q -- --listen <("$RUNNER_TEMP/cli/cranibox-linux-arm64" serve --help)
          grep -q -- --port <("$RUNNER_TEMP/cli/cranibox-linux-arm64" serve --config-root "$RUNNER_TEMP" --help)
      - uses: actions/upload-artifact@v7
        with:
          name: cranibox-cli-linux-arm64
          path: ${{ runner.temp }}/cli/cranibox-linux-arm64
          retention-days: 14
          if-no-files-found: error
  quality:
    name: Static and desktop checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/node-desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
          cache-on-failure: true
      - run: sudo apt-get update -o APT::Update::Error-Mode=any && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev librsvg2-dev libayatana-appindicator3-dev pkg-config libglib2.0-bin python3
        if: runner.os == 'Linux'
      - run: npm ci --prefix apps/node-desktop
      - run: npm run build --prefix apps/node-desktop
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo check --locked -p cranibox-node
      - run: cargo clippy --locked -p cranibox-node-desktop --features desktop --all-targets -- -D warnings
      - name: Verify Linux login launcher with spaces and reserved path characters
        if: runner.os == 'Linux'
        run: cargo test --locked -p cranibox-node-desktop --lib gio_launches -- --ignored --nocapture
      - run: npx playwright install --with-deps chromium
        working-directory: apps/node-desktop
        if: runner.os == 'Linux'
      - run: npm test
        working-directory: apps/node-desktop
        if: runner.os == 'Linux'
  native:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          cache-on-failure: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/install-herdr.py --output-directory target/herdr
      - run: cargo build --locked
      - run: cargo test --locked
        if: runner.os != 'Windows'
      - name: cargo test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --locked -- --skip peer::server::multi_node::three_nodes_sync_over_noise
          cargo test --locked -p cranibox-node --lib peer::server::multi_node::three_nodes_sync_over_noise -- --test-threads=1
      - name: Contract snapshot (fixtures round-trip through cranibox-contracts types)
        run: cargo test --locked -p cranibox-contracts --test fixtures
      - name: Verify managed Windows TightVNC installation and loopback authentication
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: python -m unittest discover -s tests -p test_windows_tightvnc.py -v
        env:
          CRANIBOX_TEST_WINDOWS_VNC: '1'
          CRANIBOX_BIN: target/debug/cranibox.exe
      - name: Verify real userspace EasyTier networking, restart and entry failover
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cranibox-easytier.zip" https://github.com/EasyTier/EasyTier/releases/download/v2.6.4/easytier-linux-x86_64-v2.6.4.zip
          printf '%s  %s\n' 61b659eaedba658fa66fe47d17e1426cdd77e5d02fa15fed447bb4357c09dfd6 "$RUNNER_TEMP/cranibox-easytier.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/cranibox-easytier.zip" -d "$RUNNER_TEMP/cranibox-easytier"
          chmod u+x "$RUNNER_TEMP/cranibox-easytier/easytier-linux-x86_64/easytier-core" "$RUNNER_TEMP/cranibox-easytier/easytier-linux-x86_64/easytier-cli"
          CRANIBOX_TEST_EASYTIER_DIR="$RUNNER_TEMP/cranibox-easytier/easytier-linux-x86_64" cargo test --locked -p cranibox-node network::tests::real_ -- --ignored --nocapture --test-threads=1
  linux-integration:
    name: Linux integration (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, projects, tasks, devices]
    runs-on: ubuntu-latest
    env:
      AGENT_WORKSPACE_SRC: ${{ github.workspace }}/agent-workspace-src
      CRANIBOX_HERDR_BIN: target/herdr/herdr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: fliaping/agent-workspace
          path: agent-workspace-src
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          # The native job writes this cache; shards only restore it.
          save-if: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: addons/control-center/ui/package-lock.json
      - run: python scripts/install-herdr.py --output-directory target/herdr
      - run: cargo build --locked
      - run: npm ci --prefix addons/control-center/ui
      - run: sudo apt-get update -o APT::Update::Error-Mode=any && sudo apt-get install -y s6 xvfb x11vnc x11-utils x11-xserver-utils xdotool
        if: matrix.suite == 'ui' || matrix.suite == 'devices'
      - run: node scripts/build-control-center-ui.cjs && git diff --exit-code -- addons/control-center/index.en.html addons/control-center/index.zh-cn.html addons/control-center/web.js addons/control-center/web.css
        if: matrix.suite == 'ui'
      - run: npx --prefix addons/control-center/ui playwright install --with-deps chromium
