name: Cranibox server and independent node client

on:
  push:
    paths: ['apps/node-desktop/**', 'Cargo.*', 'crates/**', 'tests/test_cranibox_terminal.py', 'tests/test_rust_runtime.py', 'tests/test_workspacectl_rust.py', 'tests/test_workspace_services.py', 'tests/test_workspace_bootstrap.py', 'tests/test_workspace_web_operations.py', 'tests/workspace_web_harness.py', 'scripts/measure-workspace-resources.py', 'scripts/workspacectl-web.py', 'scripts/check-control-center-web.mjs', 'scripts/build-control-center-ui.cjs', 'addons/control-center/**', 'extensions/control-center/control-center.js', 'scripts/install-workspace-services.sh', 'scripts/install-workspace-web.sh', 's6-rc.d/**', 'services/**', 'Dockerfile', 'scripts/workspacectl', 'scripts/install-workspacectl.sh', 'scripts/install-workspace-runtime.sh', 'scripts/install-cranibox.sh', 'scripts/install-cranibox.py', 'scripts/install-herdr.py', 'scripts/bootstrap-workspace-core.sh', '.github/workflows/rust-runtime.yml']
  pull_request:
    paths: ['apps/node-desktop/**', 'Cargo.*', 'crates/**', 'tests/test_cranibox_terminal.py', 'tests/test_rust_runtime.py', 'tests/test_workspacectl_rust.py', 'tests/test_workspace_services.py', 'tests/test_workspace_bootstrap.py', 'tests/test_workspace_web_operations.py', 'tests/workspace_web_harness.py', 'scripts/measure-workspace-resources.py', 'scripts/workspacectl-web.py', 'scripts/check-control-center-web.mjs', 'scripts/build-control-center-ui.cjs', 'addons/control-center/**', 'extensions/control-center/control-center.js', 'scripts/install-workspace-services.sh', 'scripts/install-workspace-web.sh', 's6-rc.d/**', 'services/**', 'Dockerfile', 'scripts/workspacectl', 'scripts/install-workspacectl.sh', 'scripts/install-workspace-runtime.sh', 'scripts/install-cranibox.sh', 'scripts/install-cranibox.py', 'scripts/install-herdr.py', 'scripts/bootstrap-workspace-core.sh', '.github/workflows/rust-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: node desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: node-desktop
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev librsvg2-dev libayatana-appindicator3-dev pkg-config
        if: runner.os == 'Linux'
      - run: npm ci --prefix apps/node-desktop
      - run: npm run build --prefix apps/node-desktop
      - run: cargo clippy --locked -p cranibox-node-desktop --features desktop --all-targets -- -D warnings
      - run: npx playwright install --with-deps chromium
        working-directory: apps/node-desktop
        if: runner.os == 'Linux'
      - run: npm test
        working-directory: apps/node-desktop
        if: runner.os == 'Linux'
      - run: npm run tauri -- build --features desktop --bundles ${{ matrix.bundles }} -- --locked
        working-directory: apps/node-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: cranibox-node-desktop-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
          if-no-files-found: error
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/install-herdr.py --output-directory target/herdr
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo check --locked -p cranibox-node
      - run: cargo build --locked
      - run: cargo test --locked
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y s6
        if: runner.os == 'Linux'
      - run: npm ci --prefix addons/control-center/ui
        if: runner.os == 'Linux'
      - run: node scripts/build-control-center-ui.cjs && git diff --exit-code -- addons/control-center/index.en.html addons/control-center/index.zh-cn.html addons/control-center/web.js addons/control-center/web.css
        if: runner.os == 'Linux'
      - run: npx --prefix addons/control-center/ui playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm test --prefix addons/control-center/ui
        if: runner.os == 'Linux'
        env:
          CRANIBOX_HERDR_BIN: ../../../target/herdr/herdr
      - run: python -m unittest discover -s tests -p test_workspace_bootstrap.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_workspace_services.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_workspace_web_operations.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_cranibox_terminal.py -v
        if: runner.os == 'Linux'
        env:
          CRANIBOX_HERDR_BIN: target/herdr/herdr
      - run: node scripts/check-control-center-web.mjs
        if: runner.os == 'Linux'
      - run: python -m pip install PyYAML
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_workspacectl_rust.py -v
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -p test_rust_runtime.py -v
        env:
          PYTHONUTF8: '1'
      - run: cargo build --release --locked -p cranibox
      - run: cargo build --release --locked -p cranibox-node
      - run: python scripts/measure-workspace-resources.py --report target/resource-baseline.json
        if: runner.os == 'Linux'
        env:
          CRANIBOX_BIN: target/release/cranibox
          CRANIBOX_NODE_BIN: target/release/cranibox-node
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: resource-baseline-linux
          path: target/resource-baseline.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cranibox-node-${{ matrix.os }}
          path: |
            target/release/cranibox-node
            target/release/cranibox-node.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cranibox-${{ matrix.os }}
          path: |
            target/release/cranibox
            target/release/cranibox.exe
            target/herdr/herdr
            target/herdr/herdr.exe
            scripts/install-herdr.py
          if-no-files-found: error
