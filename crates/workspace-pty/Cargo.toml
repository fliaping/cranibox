[package]
name = "agent-workspace-pty"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[features]
default = ["herdr"]
herdr = []

[dependencies]
anyhow = "1"
portable-pty = "0.9"
tokio = { version = "1", features = ["sync", "process", "time", "io-util", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
