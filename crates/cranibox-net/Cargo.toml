[package]
name = "cranibox-net"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"
description = "Cranibox default network: iroh endpoint, peer-http over QUIC, embedded relay and link pairing (WS1)."

[dependencies]
socket2 = { version = "0.6", features = ["all"] }
cranibox-contracts = { path = "../cranibox-contracts" }
async-trait = "0.1"
futures-util = "0.3"
anyhow = "1"
axum = "0.8"
bytes = "1"
data-encoding = "2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server"] }
iroh = "1.3.0"
iroh-relay = { version = "1.3.0", features = ["server"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
tokio-util = "0.7"
tower-service = "0.3"
tracing = "0.1"
url = "2"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.29"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
