[package]
name = "cranibox-agents"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"
description = "Cranibox agent adapters (WS5). Six reversible agent adapters."

[dependencies]
cranibox-contracts = { path = "../cranibox-contracts" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_yaml = "0.9"
json5 = "0.4"
toml_edit = { version = "0.22", features = ["serde"] }
sha2 = "0.10"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
