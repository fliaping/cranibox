[package]
name = "cranibox"
version = "1.2.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[features]
# Linux builds carry the Agent Workspace container console and service manager. macOS and Windows builds (`--no-default-features`) are the node alone.
default = ["workspace"]
workspace = [
    "dep:agent-workspacectl",
    "dep:agent-workspace-services",
    "dep:agent-workspace-web",
]
# Remote updates for a build that also carries the workspace console (the Linux
# release); they stay off inside the Agent Workspace image.
managed = []

[dependencies]
cranibox-node = { path = "../workspace-node" }
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
agent-workspacectl = { path = "../workspacectl", optional = true }
agent-workspace-services = { path = "../workspace-services", optional = true }
agent-workspace-runtime = { path = "../workspace-runtime", default-features = false, features = ["client"] }
agent-workspace-web = { path = "../workspace-web", optional = true }
