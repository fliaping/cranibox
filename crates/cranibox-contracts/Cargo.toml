[package]
name = "cranibox-contracts"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"
description = "Shared Phase 0 contracts (C1–C8) between Cranibox workstreams: types, traits, constants and fixtures only."

[features]
default = []
# In-memory implementations for parallel development and UI mocks.
mock = []

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-core = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Only `watch` for `RosterView::subscribe`; no runtime is started here.
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
cranibox-contracts = { path = ".", features = ["mock"] }
tokio = { version = "1", features = ["macros", "rt"] }
toml = "0.8"
