[package]
name = "agent-workspace-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[[bin]]
name = "workspace-runtime"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
client = ["dep:clap", "dep:reqwest", "dep:base64", "dep:futures-util", "dep:tokio-tungstenite", "dep:ed25519-dalek", "dep:snow", "dep:chacha20poly1305", "dep:data-encoding"]
server = ["client", "dep:axum", "dep:tower", "dep:base64"]

[dependencies]
anyhow = "1"
cranibox-contracts = { path = "../cranibox-contracts" }
axum = { version = "0.8", features = ["ws"], optional = true }
base64 = { version = "0.22", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
data-encoding = { version = "2", optional = true }
ed25519-dalek = { version = "2.2", optional = true }
fs2 = "0.4"
futures-util = { version = "0.3", optional = true }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = { version = "0.10", optional = true }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time", "io-util", "io-std"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
