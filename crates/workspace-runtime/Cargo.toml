[package]
name = "agent-workspace-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[features]
default = ["client"]
client = ["dep:reqwest", "dep:base64", "dep:futures-util", "dep:tokio-tungstenite", "dep:ed25519-dalek", "dep:snow", "dep:chacha20poly1305", "dep:data-encoding", "dep:hpke", "dep:rand08", "dep:zeroize"]

[dependencies]
cranibox-agents = { path = "../cranibox-agents" }
anyhow = "1"
cranibox-contracts = { path = "../cranibox-contracts" }
base64 = { version = "0.22", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
data-encoding = { version = "2", optional = true }
ed25519-dalek = { version = "2.2", optional = true }
fs2 = "0.4"
hpke = { version = "0.12", features = ["alloc", "x25519"], default-features = false, optional = true }
futures-util = { version = "0.3", optional = true }
rand = "0.9"
rand08 = { package = "rand", version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = { version = "0.10", optional = true }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time", "io-util", "io-std"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"], optional = true }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# Crops cua-driver screenshots for `zoom`.
png = "0.18"
zeroize = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
