[package]
name = "agent-workspace-services"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[[bin]]
name = "workspace-services"
path = "src/main.rs"

[dependencies]
anyhow = "1"
fs2 = "0.4"
serde_json = "1"
shell-words = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
