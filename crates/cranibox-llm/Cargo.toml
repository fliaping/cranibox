[package]
name = "cranibox-llm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"
description = "Cranibox loopback model subscription proxy"

[dependencies]
cranibox-contracts = { path = "../cranibox-contracts" }
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
cranibox-contracts = { path = "../cranibox-contracts", features = ["mock"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
